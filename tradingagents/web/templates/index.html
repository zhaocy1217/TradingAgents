<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="ta-api-base" content="{{ api_base | e }}" />
    <title>{{ title }}</title>
    <link rel="stylesheet" href="/static/app.css" />
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  </head>
  <body>
    <div id="busyOverlay" class="busy-overlay hidden">
      <div class="busy-card">
        <h3>后台正在分析</h3>
        <p id="busyStage">任务初始化中...</p>
        <p id="busyMessage">请稍候，分析期间已锁定页面操作。</p>
        <div class="busy-progress-wrap" aria-label="analysis-progress">
          <div class="busy-progress-track">
            <div id="busyProgressBar" class="busy-progress-bar" style="width: 0%"></div>
          </div>
          <div id="busyProgressText" class="busy-progress-text">0%</div>
        </div>
        <div class="row">
          <button id="cancelJobBtn" type="button">取消当前任务</button>
        </div>
      </div>
    </div>
    <main class="container">
      <header>
        <h1>TradingAgents A股分析 Web</h1>
        <p>输入公司名/股票名，触发分析并保存报告。</p>
      </header>

      <section class="card">
        <div class="tabs" id="mainTabs">
          <button type="button" class="tab-btn active" data-tab-target="tab-analyze">股票检索与分析</button>
          <button type="button" class="tab-btn" data-tab-target="tab-favorites">收藏列表</button>
          <button type="button" class="tab-btn" data-tab-target="tab-hot">最近一周热股</button>
          <button type="button" class="tab-btn" data-tab-target="tab-reports">报告查询</button>
        </div>
      </section>

      <section class="card tab-panel" id="tab-analyze">
        <h2>股票检索与分析</h2>
        <div class="row">
          <input id="symbolQuery" type="text" placeholder="例如：贵州茅台 / 600519" value="工商银行" />
          <button id="searchBtn">搜索股票代码</button>
        </div>
        <div id="symbolResults" class="list"></div>

        <form id="analyzeForm" class="row form-grid">
          <input id="symbolInput" type="text" placeholder="Symbol，如 600519.SS" value="601398.SS" />
          <input id="analysisDateInput" type="text" placeholder="分析日期 YYYY-MM-DD（可空）" />
          <select id="modeInput" title="分析模式">
            <option value="light" selected>轻度（更快,耗时大概5分钟）</option>
            <option value="deep">深度（更慢，耗时大概20分钟）</option>
          </select>
          <button type="submit">分析单只股票</button>
        </form>
      </section>

      <section class="card tab-panel hidden" id="tab-favorites">
        <div class="section-head">
          <h2>收藏列表</h2>
          <button id="refreshFavBtn">刷新</button>
        </div>
        <div class="row form-grid">
          <input id="favoriteAnalysisDateInput" type="text" placeholder="分析日期 YYYY-MM-DD（可空）" />
          <select id="favoriteModeInput" title="收藏分析模式">
            <option value="light" selected>轻度（更快）</option>
            <option value="deep">深度（更慢，旧策略）</option>
          </select>
        </div>
        <div id="favoritesList" class="list"></div>
      </section>

      <section class="card tab-panel hidden" id="tab-hot">
        <div class="section-head">
          <h2>最近一周热股</h2>
          <button id="refreshHotBtn">刷新热榜数据</button>
        </div>
        <canvas id="hotChart" height="110"></canvas>
        <div id="hotList" class="list"></div>
      </section>

      <section class="card tab-panel hidden" id="tab-reports">
        <div class="section-head">
          <h2>报告查询</h2>
          <a href="/reports">查看完整列表</a>
        </div>
        <div class="row">
          <input id="reportQuery" type="text" placeholder="输入股票名或代码" />
          <button id="searchReportBtn">搜索报告</button>
        </div>
        <div id="reportList" class="list"></div>
      </section>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
